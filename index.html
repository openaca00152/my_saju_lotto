<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의사주,나의로또 - 정통 명리 에디션</title>
    <style>
        /* 프리미엄 디자인 유지 */
        :root { --primary-dark: #0f172a; --primary: #1e293b; --gold: #d4af37; --gold-light: #fef08a; --bg-color: #f8fafc; --text-main: #334155; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.08); box-sizing: border-box; position: relative; }
        .hero-section { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 40px 20px 60px 20px; text-align: center; border-radius: 0 0 40px 40px; position: relative; overflow: hidden; }
        .hero-badge { display: inline-block; background-color: rgba(212, 175, 55, 0.2); color: var(--gold-light); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; border: 1px solid rgba(212, 175, 55, 0.3); }
        h1 { margin: 0; font-size: 28px; font-weight: 900; background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.3; }
        .hero-sub { color: #cbd5e1; font-size: 14px; margin-top: 10px; line-height: 1.5; }
        
        .input-card { background: white; border-radius: 24px; padding: 25px; margin: -30px 20px 20px 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.08); position: relative; z-index: 10; }
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        .input-row { display: flex; gap: 10px; }
        input[type="number"], select { padding: 16px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; flex: 1; text-align: center; background-color: #f8fafc; color: var(--primary-dark); font-weight: bold; transition: 0.3s; }
        input[type="number"]:focus, select:focus { border-color: var(--gold); background-color: #fff; }
        button.submit-btn { background: linear-gradient(135deg, #d4af37, #f5d76e); color: #453200; border: none; padding: 18px; font-size: 18px; font-weight: 900; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); transition: 0.3s; margin-top: 10px; }
        
        .content-area { padding: 0 20px 20px 20px; }
        .ad-space { width: 100%; height: 60px; background-color: #f1f5f9; text-align: center; line-height: 60px; color: #94a3b8; font-size: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #cbd5e1; }
        
        #loading-section { display: none; text-align: center; padding: 60px 0; }
        .spinner { width: 60px; height: 60px; border: 4px solid #f1f5f9; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; font-weight: bold; color: var(--primary); }

        #result-section { display: none; }
        .fortune-article { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid var(--primary); }
        .fortune-article h2 { font-size: 20px; color: var(--primary-dark); margin-top: 0; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
        .fortune-article p { line-height: 1.8; font-size: 16px; color: #475569; text-align: justify; margin-bottom: 20px; }
        .highlight { color: #b45309; font-weight: bold; background: linear-gradient(180deg, rgba(255,255,255,0) 60%, #fef08a 40%); }
        .hanja { font-size: 18px; font-weight: 900; color: #1e293b; }

        .lotto-blind-section { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .lotto-blind-title { color: var(--gold-light); font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .reveal-btn { background-color: var(--gold); color: #000; border: none; padding: 16px 24px; font-size: 16px; font-weight: 900; border-radius: 50px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .lotto-balls { display: none; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
        .lotto-ball { width: 48px; height: 48px; background: radial-gradient(circle at 30% 30%, #ffd54f, #ffb300); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; color: #453200; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="hero-section">
        <div class="hero-badge">정통 사주명리 만세력 엔진 탑재</div>
        <h1>나의사주, 나의로또</h1>
        <div class="hero-sub">태어난 날의 고유한 오행(五行)을 분석하여<br>가장 강력한 재물 파동 번호를 추출합니다.</div>
    </div>

    <div class="input-card" id="input-section">
        <div class="input-group">
            <div class="input-row">
                <input type="number" id="birthDate" placeholder="생년월일 8자리 (예: 19800515)" />
            </div>
            <div class="input-row">
                <select id="birthTime">
                    <option value="99">태어난 시간 모름</option>
                    <option value="23">자시 (23:00~01:00)</option>
                    <option value="1">축시 (01:00~03:00)</option>
                    <option value="3">인시 (03:00~05:00)</option>
                    <option value="5">묘시 (05:00~07:00)</option>
                    <option value="7">진시 (07:00~09:00)</option>
                    <option value="9">사시 (09:00~11:00)</option>
                    <option value="11">오시 (11:00~13:00)</option>
                    <option value="13">미시 (13:00~15:00)</option>
                    <option value="15">신시 (15:00~17:00)</option>
                    <option value="17">유시 (17:00~19:00)</option>
                    <option value="19">술시 (19:00~21:00)</option>
                    <option value="21">해시 (21:00~23:00)</option>
                </select>
            </div>
            <button class="submit-btn" onclick="startLoading()">명리 운세 & 행운 번호 분석</button>
        </div>
    </div>

    <div class="content-area">
        <div class="ad-space">구글 애드센스 상단 배너 자리</div>

        <div id="loading-section">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">사주 만세력 데이터를 동기화 중입니다...</div>
        </div>

        <div id="result-section">
            <div class="fortune-article">
                <h2>📜 정통 명리학 재물운 분석서</h2>
                <div id="fortune-long-text"></div>
            </div>

            <div class="lotto-blind-section">
                <div class="lotto-blind-title">나의 재물 오행 기반 로또 번호</div>
                <p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">* 명리학 '하도낙서' 기반 귀하의 재물을 끌어당기는 고유 숫자를 포함했습니다.</p>
                <button class="reveal-btn" id="reveal-btn" onclick="revealLotto()">🔒 터치하여 나의 로또 번호 확인하기</button>
                <div class="lotto-balls" id="lotto-balls"></div>
            </div>
        </div>

        <div class="ad-space" style="margin-top: 20px;">구글 애드센스 하단 배너 자리</div>
    </div>
</div>

<script>
    // 10천간(天干)과 12지지(地支), 오행(五行) 데이터
    const stems = ["갑(甲)", "을(乙)", "병(丙)", "정(丁)", "무(戊)", "기(己)", "경(庚)", "신(辛)", "임(壬)", "계(癸)"];
    const branches = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];
    const elements = ["나무(木)", "나무(木)", "불(火)", "불(火)", "흙(土)", "흙(土)", "쇠(金)", "쇠(金)", "물(水)", "물(水)"];
    
    // 오행별 재물(재성) 관계 (내가 극하는 오행이 재물)
    // 목->토, 화->금, 토->수, 금->목, 수->화
    const wealthElements = {
        "나무(木)": { name: "흙(土)", numbers: [5, 10, 15, 20, 25, 30, 35, 40, 45], color: "노란색/황금색" },
        "불(火)": { name: "쇠(金)", numbers: [4, 9, 14, 19, 24, 29, 34, 39, 44], color: "흰색/금속성" },
        "흙(土)": { name: "물(水)", numbers: [1, 6, 11, 16, 21, 26, 31, 36, 41], color: "검은색/어두운 색" },
        "쇠(金)": { name: "나무(木)", numbers: [3, 8, 13, 18, 23, 28, 33, 38, 43], color: "푸른색/녹색" },
        "물(水)": { name: "불(火)", numbers: [2, 7, 12, 17, 22, 27, 32, 37, 42], color: "붉은색/보라색" }
    };

    function startLoading() {
        const birthInput = document.getElementById('birthDate').value;
        if(birthInput.length !== 8) { alert("생년월일 8자리를 정확히 입력해주세요!"); return; }
        
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('loading-section').style.display = 'block';
        
        const loadingText = document.getElementById('loading-text');
        setTimeout(() => { loadingText.innerText = "천간(天干)과 지지(地支)를 산출 중입니다..."; }, 1000);
        setTimeout(() => { loadingText.innerText = "일주(日柱)의 오행을 기반으로 재물수를 분석합니다..."; }, 2200);
        setTimeout(() => { document.getElementById('loading-section').style.display = 'none'; generateResult(); }, 3500);
    }

    function generateResult() {
        const birthInput = document.getElementById('birthDate').value;
        const year = parseInt(birthInput.substring(0,4));
        const month = parseInt(birthInput.substring(4,6));
        const day = parseInt(birthInput.substring(6,8));

        // [핵심 기술 1] 일주(日柱: 태어난 날의 간지) 수학적 계산 (기준일: 2000년 1월 1일은 무오(戊午)일)
        const baseUTC = Date.UTC(2000, 0, 1);
        const inputUTC = Date.UTC(year, month - 1, day);
        const diffDays = Math.floor((inputUTC - baseUTC) / (1000 * 60 * 60 * 24));
        
        let stemIndex = (4 + diffDays) % 10; // 무(戊)는 인덱스 4
        if(stemIndex < 0) stemIndex += 10;
        let branchIndex = (6 + diffDays) % 12; // 오(午)는 인덱스 6
        if(branchIndex < 0) branchIndex += 12;

        const myStem = stems[stemIndex];
        const myBranch = branches[branchIndex];
        const myElement = elements[stemIndex]; // 일간(태어난 날의 천간)의 오행이 곧 '나의 기운'
        
        // [핵심 기술 2] 재성(재물운) 도출
        const myWealth = wealthElements[myElement];

        // 텍스트 생성
        let articleHTML = `
            <p>명리학 만세력 연산 결과, 귀하는 <strong>${year}년 ${month}월 ${day}일</strong>에 태어났으며, 사주의 중심이 되는 일주(日柱)는 <span class="hanja">${myStem}${myBranch}</span>입니다.</p>
            <p>즉, 우주 만물을 이루는 다섯 가지 기운 중 <span class="highlight">온전한 '${myElement}'의 기운을 타고난 분</span>입니다. ${myElement}의 기운을 가진 분들은 기본적으로 심지가 굳고 결단력이 있으며, 한 번 목표를 정하면 끝까지 밀어붙이는 강한 잠재력을 지니고 있습니다.</p>
            
            <p><strong>[당신의 재물운(財星) 분석]</strong><br>
            사주명리학에서 재물은 '내가 통제하고 취할 수 있는 기운(克)'을 의미합니다. ${myElement}으로 태어난 귀하에게 재물을 상징하는 오행은 바로 <span class="highlight">'${myWealth.name}'</span>입니다. 따라서 귀하의 운기에 ${myWealth.name}의 기운이 들어오거나, 일상에서 ${myWealth.name}을 상징하는 색상인 <strong>${myWealth.color}</strong>을 가까이할 때 금전운이 폭발적으로 상승하게 됩니다.</p>
            
            <p>올해의 거대한 우주적 파동과 귀하의 일주(<span class="hanja">${myStem}</span>)가 만나며, 그동안 막혀있던 금전의 맥이 뚫리는 형국입니다. 투자나 문서 계약에 있어서 주변 사람의 말보다는 본인의 직관을 믿는 것이 유리하며, 특히 이번 달은 남모르게 쌓아온 노력들이 재물로 치환되는 아주 중요한 분기점입니다.</p>
            
            <p><strong>[동양 수비학 기반 행운 번호]</strong><br>
            아래 블라인드에 숨겨진 로또 번호는 단순한 랜덤이 아닙니다. 역학의 하도낙서(河圖洛書) 이론에 따라 귀하의 재물을 뜻하는 '${myWealth.name}'의 고유 주파수 숫자들을 핵심 베이스로 추출한 <strong>'사주 맞춤형 재물 번호'</strong>입니다. 이 번호의 기운을 받아 오늘 하루 긍정적인 파동을 이끌어내시길 바랍니다.</p>
        `;
        document.getElementById('fortune-long-text').innerHTML = articleHTML;

        // [핵심 기술 3] 재물 오행 기반 로또 번호 생성
        let lottoNumbers = [];
        
        // 1. 내 재물 오행에 해당하는 행운의 숫자 풀(Pool)에서 2~3개를 확정적으로 뽑음
        let wealthNumsPool = [...myWealth.numbers];
        // 섞기
        wealthNumsPool.sort(() => Math.random() - 0.5); 
        let pickCount = Math.floor(Math.random() * 2) + 2; // 2개 또는 3개
        for(let i=0; i<pickCount; i++) {
            lottoNumbers.push(wealthNumsPool[i]);
        }

        // 2. 나머지 번호는 1~45 중에서 중복 없이 랜덤하게 채움
        while(lottoNumbers.length < 6) {
            let randNum = Math.floor(Math.random() * 45) + 1;
            if(!lottoNumbers.includes(randNum)) {
                lottoNumbers.push(randNum);
            }
        }
        
        // 보기 좋게 정렬
        lottoNumbers.sort((a,b) => a - b);

        const ballsContainer = document.getElementById('lotto-balls');
        ballsContainer.innerHTML = '';
        lottoNumbers.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'lotto-ball';
            ball.innerText = num;
            ballsContainer.appendChild(ball);
        });

        document.getElementById('result-section').style.display = 'block';
        document.getElementById('reveal-btn').style.display = 'flex';
        document.getElementById('lotto-balls').style.display = 'none';
    }

    function revealLotto() {
        document.getElementById('reveal-btn').style.display = 'none';
        document.getElementById('lotto-balls').style.display = 'flex';
    }
</script>

</body>
</html>
