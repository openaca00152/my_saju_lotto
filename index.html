<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의사주,나의로또 - 프리미엄 운세</title>
    <style>
        /* 프리미엄 컬러 팔레트 및 기본 설정 */
        :root {
            --primary-dark: #0f172a; /* 딥 네이비 */
            --primary: #1e293b;
            --gold: #d4af37; /* 고급스러운 골드 */
            --gold-light: #fef08a;
            --bg-color: #f8fafc;
            --text-main: #334155;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
        }

        /* 🔮 세련된 히어로(상단) 섹션 */
        .hero-section {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 40px 20px 60px 20px;
            text-align: center;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
            position: relative;
            overflow: hidden;
        }
        .hero-section::after {
            content: '✨';
            position: absolute;
            font-size: 100px;
            opacity: 0.05;
            top: -20px;
            right: -20px;
        }
        .hero-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.2);
            color: var(--gold-light);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            /* 골드 그라데이션 텍스트 */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        .hero-sub {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 10px;
            line-height: 1.5;
        }

        /* 입력 폼 카드 디자인 */
        .input-card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            margin: -30px 20px 20px 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            position: relative;
            z-index: 10;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-row { display: flex; gap: 10px; }
        input[type="number"], select {
            padding: 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            flex: 1;
            text-align: center;
            background-color: #f8fafc;
            color: var(--primary-dark);
            font-weight: bold;
            transition: 0.3s;
        }
        input[type="number"]:focus, select:focus {
            border-color: var(--gold);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        
        /* 빛나는 골드 버튼 */
        button.submit-btn {
            background: linear-gradient(135deg, #d4af37, #f5d76e);
            color: #453200;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
            margin-top: 10px;
        }
        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        /* 결과창 및 로딩 디자인 */
        .content-area { padding: 0 20px 20px 20px; }
        .ad-space {
            width: 100%;
            height: 60px;
            background-color: #f1f5f9;
            text-align: center;
            line-height: 60px;
            color: #94a3b8;
            font-size: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed #cbd5e1;
        }
        
        #loading-section { display: none; text-align: center; padding: 60px 0; }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; font-weight: bold; color: var(--primary); }

        #result-section { display: none; }
        
        /* 칼럼형 장문 텍스트 영역 */
        .fortune-article {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-top: 4px solid var(--primary);
        }
        .fortune-article h2 {
            font-size: 20px;
            color: var(--primary-dark);
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .fortune-article p {
            line-height: 1.9;
            font-size: 16px;
            color: #475569;
            text-align: justify;
            margin-bottom: 20px;
        }
        .fortune-article p:last-child { margin-bottom: 0; }
        .highlight { color: #b45309; font-weight: bold; background: linear-gradient(180deg, rgba(255,255,255,0) 60%, #fef08a 40%); }

        /* 블라인드 로또 버튼 영역 (수익 극대화의 핵심) */
        .lotto-blind-section {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }
        .lotto-blind-title {
            color: var(--gold-light);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .reveal-btn {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: 0.3s;
        }
        .reveal-btn:hover { background-color: #f5d76e; transform: scale(1.02); }
        
        .lotto-balls { display: none; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
        .lotto-ball {
            width: 48px; height: 48px;
            background: radial-gradient(circle at 30% 30%, #ffd54f, #ffb300);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 20px; color: #453200;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 세련된 히어로 섹션 -->
    <div class="hero-section">
        <div class="hero-badge">프리미엄 명리 분석 알고리즘</div>
        <h1>나의사주, 나의로또</h1>
        <div class="hero-sub">
            사주팔자의 오행 파동과 현대 수비학을 결합하여<br>
            당신의 재물운과 행운의 숫자를 정밀하게 추출합니다.
        </div>
    </div>

    <!-- 입력 카드 영역 -->
    <div class="input-card" id="input-section">
        <div class="input-group">
            <div class="input-row">
                <input type="number" id="birthDate" placeholder="생년월일 8자리 (예: 19800515)" />
            </div>
            <div class="input-row">
                <select id="birthTime">
                    <option value="99">태어난 시간 모름</option>
                    <option value="23">자시 (23:00~01:00)</option>
                    <option value="1">축시 (01:00~03:00)</option>
                    <option value="3">인시 (03:00~05:00)</option>
                    <option value="5">묘시 (05:00~07:00)</option>
                    <option value="7">진시 (07:00~09:00)</option>
                    <option value="9">사시 (09:00~11:00)</option>
                    <option value="11">오시 (11:00~13:00)</option>
                    <option value="13">미시 (13:00~15:00)</option>
                    <option value="15">신시 (15:00~17:00)</option>
                    <option value="17">유시 (17:00~19:00)</option>
                    <option value="19">술시 (19:00~21:00)</option>
                    <option value="21">해시 (21:00~23:00)</option>
                </select>
            </div>
            <button class="submit-btn" onclick="startLoading()">내 운명과 행운 번호 열람하기</button>
        </div>
    </div>

    <div class="content-area">
        <!-- 구글 애드센스 상단 (결과를 기다리며 노출됨) -->
        <div class="ad-space">구글 애드센스 상단 배너 자리</div>

        <!-- 몰입형 로딩 애니메이션 -->
        <div id="loading-section">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">사주 명식을 우주적 파동과 동기화 중입니다...</div>
        </div>

        <!-- 결과 섹션 -->
        <div id="result-section">
            
            <!-- 체류시간을 극대화하는 칼럼형 장문 텍스트 (약 1,000자 생성) -->
            <div class="fortune-article">
                <h2>📜 귀하를 위한 정밀 재물운 분석서</h2>
                <div id="fortune-long-text">
                    <!-- 자바스크립트가 여러 문단을 조합하여 이곳에 긴 글을 뿌려줍니다. -->
                </div>
            </div>

            <!-- 수익 극대화: 블라인드 로또 버튼 (위아래로 광고가 붙으면 효과적) -->
            <div class="lotto-blind-section">
                <div class="lotto-blind-title">우주의 기운이 담긴 나의 행운 번호</div>
                <p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">* 분석된 명식을 바탕으로 재물 파동이 가장 강한 6개의 숫자를 추출했습니다.</p>
                
                <button class="reveal-btn" id="reveal-btn" onclick="revealLotto()">
                    🔒 터치하여 나의 로또 번호 확인하기
                </button>
                
                <div class="lotto-balls" id="lotto-balls">
                    <!-- 로또 번호가 여기에 들어갑니다 -->
                </div>
            </div>
        </div>

        <div class="ad-space" style="margin-top: 20px;">구글 애드센스 하단 배너 자리 (버튼 아래 배치)</div>
    </div>
</div>

<script>
    function mulberry32(a) {
        return function() {
            var t = a += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    function startLoading() {
        const birthInput = document.getElementById('birthDate').value;
        if(birthInput.length !== 8) {
            alert("생년월일 8자리를 정확히 입력해주세요! (예: 19800515)");
            return;
        }
        
        // 애니메이션 효과
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('loading-section').style.display = 'block';
        
        const loadingText = document.getElementById('loading-text');
        setTimeout(() => { loadingText.innerText = "대운과 세운의 흐름을 분석하고 있습니다..."; }, 1200);
        setTimeout(() => { loadingText.innerText = "재물 파동에 맞는 행운의 숫자를 추출 중입니다..."; }, 2400);
        
        setTimeout(() => {
            document.getElementById('loading-section').style.display = 'none';
            generateResult();
        }, 3800); // 3.8초의 체류시간 확보
    }

    function generateResult() {
        const birthInput = document.getElementById('birthDate').value;
        const timeInput = document.getElementById('birthTime').value;
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1;
        const date = today.getDate();
        
        const baseSeed = parseInt(birthInput) + parseInt(timeInput) + year + month + date;
        const randomFunc = mulberry32(baseSeed);

        // --- 1. 긴 칼럼형 텍스트 생성 (문단 조합 로직) ---
        // 배열을 통해 수백 가지의 조합을 만들어내어 구글 봇에게 가치 있는 콘텐츠로 인식시킴
        const p1 = [
            `입력하신 정보(${birthInput.substring(0,4)}년생)의 타고난 사주 원국을 바탕으로 현재의 운기를 감정해 보았습니다. 우주의 거대한 순환 속에서 인간의 삶은 일정한 리듬을 타게 됩니다. 특히 귀하의 현재 운기는 오행 중 <span class="highlight">금(金)과 수(水)의 기운이 강력하게 교차</span>하는 지점에 놓여 있습니다. 이는 오랫동안 준비해 온 일들이 서서히 결실을 맺기 시작하는 신호로 해석됩니다.`,
            `명리학의 관점에서 볼 때, ${birthInput.substring(4,6)}월에 태어나신 분들의 고유한 기질은 인내심과 뛰어난 통찰력입니다. 올해의 거대한 기운과 귀하의 사주가 맞물리면서, 그동안 막혀있던 운로가 뚫리고 시야가 넓어지는 경험을 하게 될 것입니다. 지금은 <span class="highlight">작은 변화의 조짐을 기민하게 포착하는 것</span>이 매우 중요한 시기입니다.`
        ];
        
        const p2 = [
            `가장 궁금해하실 재물운의 흐름을 살펴보면, <strong>계단식 상승의 초입부</strong>에 진입해 있습니다. 하늘에서 뚝 떨어지는 일확천금보다는, 귀하가 무심코 투자한 시간과 작은 자본이 눈덩이처럼 불어나는 형국입니다. 특히 이달 중순 이후부터는 주변의 지인이나 우연히 접한 정보에서 뜻밖의 수익 창출 기회를 발견할 수 있습니다. <span class="highlight">평소라면 스쳐 지나갈 숫자나 징조를 주의 깊게 살펴보십시오.</span>`,
            `현재 금전운의 온도는 매우 뜨겁습니다. 귀하를 감싸고 있는 재물 파동은 정체되어 있지 않고 역동적으로 움직이고 있습니다. 이러한 운기에는 지나치게 방어적인 태도보다는, 본인의 직관을 믿고 가벼운 마음으로 기회에 베팅해 보는 것이 좋습니다. 다만, 남들의 시선을 의식한 과시성 소비는 들어오는 복을 걷어차는 격이니 주의가 필요합니다.`
        ];

        const p3 = [
            `사회적 관계나 직장 내에서의 위치 또한 긍정적인 파장을 맞이하고 있습니다. 귀하의 능력을 시기하던 불필요한 구설수는 점차 사그라들고, 능력을 온전히 인정해 주는 '귀인'이 다가오는 형국입니다. 서북쪽 방향에서 좋은 소식이 들려올 가능성이 높으며, 회색이나 검은색 계열의 소지품이 귀하의 부족한 기운을 훌륭하게 보완해 줄 것입니다.`,
            `사업이나 직업운에 있어서는 새로운 문이 열리는 시기입니다. 낯선 제안이나 부서 이동 등 익숙하지 않은 상황이 펼쳐질 수 있으나, 이는 우주가 귀하를 더 높은 곳으로 이끌기 위한 테스트와 같습니다. 주저하지 말고 변화의 흐름에 몸을 맡기십시오. 당신의 내면 깊은 곳에 자리 잡은 잠재력이 비로소 빛을 발하게 될 것입니다.`
        ];

        const p4 = [
            `결론적으로 현재 귀하의 총운은 '물고기가 드디어 큰 강을 만난 격(如魚得水)'입니다. 조급한 마음을 버리고 여유로운 태도로 일상에 임하십시오. <strong>아래에 도출된 행운의 번호는 단순한 무작위 숫자가 아닙니다.</strong> 오늘 당신의 생년월일과 태어난 시간의 파동을 현대 수비학에 대입하여 산출한 맞춤형 '재물 주파수'입니다. 이 번호를 마음에 새기고 긍정적인 기운으로 남은 하루를 보내시길 바랍니다.`
        ];

        const articleHTML = `
            <p>${p1[Math.floor(randomFunc() * p1.length)]}</p>
            <p>${p2[Math.floor(randomFunc() * p2.length)]}</p>
            <p>${p3[Math.floor(randomFunc() * p3.length)]}</p>
            <p>${p4[0]}</p>
        `;
        document.getElementById('fortune-long-text').innerHTML = articleHTML;

        // --- 2. 로또 번호 추출 (숨김 상태) ---
        const randomLotto = mulberry32(baseSeed + 777);
        let numbers = [];
        while(numbers.length < 6) {
            let num = Math.floor(randomLotto() * 45) + 1;
            if(numbers.indexOf(num) === -1) numbers.push(num);
        }
        numbers.sort((a,b) => a - b);

        const ballsContainer = document.getElementById('lotto-balls');
        ballsContainer.innerHTML = '';
        numbers.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'lotto-ball';
            ball.innerText = num;
            ballsContainer.appendChild(ball);
        });

        // 결과창 표시
        document.getElementById('result-section').style.display = 'block';
    }

    // 블라인드 버튼 클릭 시 번호 공개 함수
    function revealLotto() {
        document.getElementById('reveal-btn').style.display = 'none';
        document.getElementById('lotto-balls').style.display = 'flex';
    }
</script>

</body>
</html>
